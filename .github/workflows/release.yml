name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (e.g. 1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # The version lives in CMakeLists.txt as plain set() calls, so a release patches it from the tag.
      # The updater compares the release tag with this number: they have to match.
      - name: Work out the version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          IFS=. read -r major minor patch <<< "$v"
          sed -i -E \
            -e "s/^set\(Launcher_VERSION_MAJOR .*/set(Launcher_VERSION_MAJOR ${major:-0})/" \
            -e "s/^set\(Launcher_VERSION_MINOR .*/set(Launcher_VERSION_MINOR ${minor:-0})/" \
            -e "s/^set\(Launcher_VERSION_PATCH .*/set(Launcher_VERSION_PATCH ${patch:-0})/" \
            CMakeLists.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          modules: qtnetworkauth
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --preset windows_msvc -B build
          -DENABLE_LTO=OFF
          -DBUILD_TESTING=OFF
          -DLauncher_UPDATER_GITHUB_REPO=https://github.com/${{ github.repository }}
          -DLauncher_BUILD_ARTIFACT=Windows-MSVC
          -DLauncher_BUILD_PLATFORM=Windows

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: |
          cmake --install build --config Release --prefix install
          Copy-Item -Recurse install install-portable
          cmake --install build --config Release --prefix install-portable --component portable

      - name: Build the installer
        working-directory: install
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" -NOCD "${{ github.workspace }}\build\program_info\win_install.nsi"

      # The updater picks an asset whose name contains the build artifact ("Windows-MSVC"), takes the
      # installer for an installed copy and the "Portable" archive for a portable one: keep both names.
      - name: Name the assets
        run: |
          Move-Item PhiLauncher-Setup.exe "PhiLauncher-Windows-MSVC-Setup-${{ steps.version.outputs.version }}.exe"
          Compress-Archive -Path install-portable\* -DestinationPath "PhiLauncher-Windows-MSVC-Portable-${{ steps.version.outputs.version }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Phi Launcher ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            PhiLauncher-Windows-MSVC-Setup-*.exe
            PhiLauncher-Windows-MSVC-Portable-*.zip
